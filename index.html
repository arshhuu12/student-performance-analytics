<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Analytics</title>

    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>

    <header>
        <h1>Student Performance Analytics</h1>
        <p>Interactive Student Performance Dashboard</p>
    </header>

    <main>

        <section class="dashboard-controls">

            <div class="filter-group">
                <label for="department-select">
                    Department
                </label>

                <select id="department-select">
                    <option value="ALL">All Departments</option>
                    <option value="CSE">CSE</option>
                    <option value="AI & DS">AI & DS</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Civil">Civil</option>
                    <option value="IT">IT</option>
                </select>
            </div>

            <div class="dashboard-summary">
                <div class="summary-card">
                    <span>Total Students</span>
                    <strong id="total-students">0</strong>
                </div>

                <div class="summary-card">
                    <span>Average Marks</span>
                    <strong id="average-marks">0</strong>
                </div>

                <div class="summary-card">
                    <span>Average Attendance</span>
                    <strong id="average-attendance">0</strong>
                </div>
            </div>

        </section>

        <section class="chart-card">

            <h2>Student Final Marks</h2>

            <div class="controls">
                <button id="change-dataset">Change Dataset</button>
                <button id="sort-ascending">Sort Ascending</button>
                <button id="sort-descending">Sort Descending</button>
            </div>

            <div id="marks-chart"></div>

        </section>

        <section class="chart-card">

            <h2>Monthly Attendance</h2>

            <div class="controls">
                <button id="previous-month">
                    Previous Month
                </button>

                <span id="current-month">
                    January
                </span>

                <button id="next-month">
                    Next Month
                </button>
            </div>

            <div id="attendance-chart"></div>

        </section>

        <section class="chart-card">

            <h2>Attendance vs Internal Marks</h2>

            <div class="controls">

                <button id="reset-scatter">
                    Reset Selection
                </button>

            </div>

            <div id="scatter-chart"></div>

        </section>

        <section class="chart-card">

            <h2>Class Average Marks Across Semesters</h2>

            <div class="controls">

                <button id="play-semesters">
                    Play
                </button>

                <button id="pause-semesters">
                    Pause
                </button>

                <button id="restart-semesters">
                    Restart
                </button>

            </div>

            <div id="semester-chart"></div>

        </section>

        <section class="chart-card">
            <h2>Performance Category Distribution</h2>

            <div class="controls">
                <label for="section-select">Select Section:</label>

                <select id="section-select">
                    <option value="A">Section A</option>
                    <option value="B">Section B</option>
                    <option value="C">Section C</option>
                    <option value="D">Section D</option>
                </select>
            </div>

            <div id="performance-pie-chart"></div>
        </section>

    </main>

    <div id="scatter-tooltip"></div>

    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- Our application -->
    <script type="module" src="src/js/main.js"></script>

</body>
</html>
